          }''')
          
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          
          require(os.environ["GITHUB_REPOSITORY"] == REPOSITORY, "Wrong repository")
          require(os.environ["GITHUB_REF"] == "refs/heads/main", "Main branch required")
          require(git("rev-parse", "HEAD") == os.environ["GITHUB_SHA"], "Unexpected checkout commit")
          require(len(git("rev-list", "--parents", "-n", "1", "HEAD").split()) == 2, "Bootstrap requires one parent")
          require(len(git("rev-list", "--parents", "-n", "1", "HEAD^").split()) == 1, "Archive commit must be a fresh root")
          require(git("ls-tree", "-r", "--name-only", "HEAD^").splitlines() == [ARCHIVE], "Parent must contain only clean archive")
          require(set(git("ls-tree", "-r", "--name-only", "HEAD").splitlines()) == {ARCHIVE, ".github/workflows/bootstrap.yml"}, "Unexpected initial files")
          require(git("diff", "--name-only", "HEAD^", "HEAD").splitlines() == [".github/workflows/bootstrap.yml"], "Bootstrap commit must only add its workflow")
          require(not git("status", "--porcelain"), "Checkout must be clean")
          archive = pathlib.Path(ARCHIVE)
          require(archive.is_file() and not archive.is_symlink(), "Regular archive required")
          require(archive.stat().st_size == 2046400, "Archive size mismatch")
          require(hashlib.sha256(archive.read_bytes()).hexdigest() == ARCHIVE_SHA256, "Archive hash mismatch")
          with zipfile.ZipFile(archive) as bundle:
              members = bundle.infolist()
              require(len(members) == len(EXPECTED), "Unexpected member count or duplicates")
              require({m.filename for m in members} == set(EXPECTED), "Archive member set mismatch")
              require(not bundle.comment, "Archive comment is not allowed")
              payloads = {}
              for member in members:
                  name = member.filename
                  path = pathlib.PurePosixPath(name)
                  require(not path.is_absolute() and str(path) == name and "\\" not in name, "Unsafe member path")
                  require(all(part not in (".", "..", ".git", ".github") for part in path.parts), "Forbidden member path")
                  require(not member.is_dir() and stat.S_ISREG(member.external_attr >> 16), "Regular files only")
                  require(not member.comment and not member.extra, "Unexpected member metadata")
                  require(member.file_size == EXPECTED[name]["size"], "Member size mismatch")
                  data = bundle.read(member)
                  require(hashlib.sha256(data).hexdigest() == EXPECTED[name]["sha256"], "Member hash mismatch")
                  payloads[name] = data
              for name, data in payloads.items():
                  target = pathlib.Path(name)
                  require(not target.exists(), "Refusing to overwrite an existing file")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          subprocess.run(["npm", "run", "verify"], check=True)
          # Verify tests/build did not modify any of the exact source bytes we approved.
          for name, expected in EXPECTED.items():
              require(hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected["sha256"], "Source changed during verification")
          subprocess.run(["git", "rm", "--", ARCHIVE], check=True)
          subprocess.run(["git", "add", "--", *sorted(EXPECTED)], check=True)
          staged = set(git("diff", "--cached", "--name-only").splitlines())
          require(staged == set(EXPECTED) | {ARCHIVE}, "Unexpected staged files")
          require(not any(name.startswith(".github/") for name in staged), "Workflow writes are prohibited")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "commit", "-m", "Import verified clean public game source"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          require(git("ls-remote", "origin", "refs/heads/main").split()[0] == git("rev-parse", "HEAD"), "Remote commit verification failed")
          print("Clean public source committed and remote commit verified.")
