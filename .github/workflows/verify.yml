name: Verify game structure and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show runner runtimes
        run: node --version && python3 --version
      - name: Verify expected structure, nonempty tests and static build
        run: npm run verify
